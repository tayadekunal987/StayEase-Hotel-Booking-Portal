# ── Development Profile (H2 In-Memory) ────────────────────────────────────────
# Use this profile if MySQL is not running on your computer.
# Start with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:stayease_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false

