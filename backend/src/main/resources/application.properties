# ── Database ──────────────────────────────────────────────────────────────────
# Set these environment variables before running the application.
# Example for Linux/macOS: export DB_URL=jdbc:mysql://localhost:3306/stayease
# Example for Windows CMD: set DB_PASSWORD=yourpassword
#
# Default values (shown after the colon) are for local development only.
# Never commit real credentials to source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stayease?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# 'update': Hibernate creates/updates tables automatically from entity classes.
# Change to 'validate' in production after the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=stayease
server.port=8080

# ── Jackson (JSON serialisation) ──────────────────────────────────────────────
# Serialize LocalDate as "2026-12-01", not as a timestamp array.
spring.jackson.serialization.write-dates-as-timestamps=false

